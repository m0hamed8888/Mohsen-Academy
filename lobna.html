<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; }

  .jeopardy-wrapper {
    background: linear-gradient(135deg, #1a0533 0%, #0d1f6e 50%, #1a0533 100%);
    min-height: 100vh;
    padding: 16px;
    color: white;
  }

  .game-title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #00e5ff;
    letter-spacing: 4px;
    text-shadow: 0 0 10px rgba(0,229,255,0.5);
    margin-bottom: 8px;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  .top-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .icon-btn {
    background: rgba(255,255,255,0.1);
    border: 2px solid #3a5aaf;
    border-radius: 8px;
    padding: 8px 14px;
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.2); }

  .scores-bar {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .score-box {
    background: rgba(255,255,255,0.1);
    border: 2px solid #ffd700;
    border-radius: 8px;
    padding: 8px 18px;
    text-align: center;
    min-width: 130px;
    position: relative;
  }

  .score-box.team1 { border-color: #ff6b6b; }
  .score-box.team2 { border-color: #4ecdc4; }
  .score-box.active-turn { box-shadow: 0 0 14px rgba(255,255,255,0.7); }

  .team-name-input {
    background: transparent;
    border: none;
    color: #ffd700;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    letter-spacing: 1px;
  }
  .score-box.team1 .team-name-input { color: #ff8a8a; }
  .score-box.team2 .team-name-input { color: #6ee7e0; }
  .team-name-input:focus { outline: 1px dashed rgba(255,255,255,0.4); }

  .score-label { font-size: 10px; color: #aaa; margin-top: 2px; }
  .score-value { font-size: 22px; font-weight: bold; color: #ffd700; }
  .score-box.team1 .score-value { color: #ff6b6b; }
  .score-box.team2 .score-value { color: #4ecdc4; }

  .turn-indicator {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffd700;
    color: #1a1a1a;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
    display: none;
  }
  .score-box.active-turn .turn-indicator { display: block; }

  .meta-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 12px;
    color: #aac;
  }
  .meta-bar b { color: #ffd700; }

  .board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    max-width: 900px;
    margin: 0 auto;
    align-items: stretch;
  }

  .cat-header {
    background: rgba(255,255,255,0.06);
    border: 2px solid #3a5aaf;
    border-radius: 6px;
    padding: 8px 4px;
    text-align: center;
    font-size: 11px;
    font-weight: bold;
    color: #aac;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
  }

  .tile {
    background: #1a3a8f;
    border: 2px solid #3a5aaf;
    border-radius: 6px;
    padding: 12px 4px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #ffd700;
    cursor: pointer;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, background 0.2s;
    font-family: 'Arial Black', Arial, sans-serif;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    position: relative;
  }

  .tile:hover { background: #2a4aaf; transform: scale(1.03); }
  .tile.used { background: #0d1f4e; color: #333; cursor: default; border-color: #1a2a5e; }
  .tile.used:hover { transform: none; }
  .tile.empty-slot { background: transparent; border-color: transparent; cursor: default; }
  .tile.empty-slot:hover { transform: none; }
  .tile.bonus-tile { border-color: #ffd700; }
  .tile .bonus-star {
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 11px;
  }
  .tile .dual-img-star {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 11px;
  }

  .edit-fab {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(0,0,0,0.5);
    border-radius: 4px;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: white;
    cursor: pointer;
  }
  .edit-fab:hover { background: rgba(0,0,0,0.8); }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,10,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
    overflow-y: auto;
  }

  .modal-overlay.active { display: flex; }

  .question-card {
    background: #1a3a8f;
    border: 3px solid #ffd700;
    border-radius: 16px;
    padding: 32px;
    max-width: 700px;
    width: 100%;
    text-align: center;
    position: relative;
    margin: auto;
  }

  .q-category { font-size: 13px; color: #aac; letter-spacing: 2px; margin-bottom: 8px; }
  .q-value { font-size: 28px; font-weight: bold; color: #ffd700; margin-bottom: 20px; font-family: 'Arial Black', Arial, sans-serif; }
  .q-text {
    font-size: 18px;
    color: white;
    line-height: 1.6;
    margin-bottom: 20px;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .q-img {
    max-width: 100%;
    max-height: 260px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 2px solid rgba(255,215,0,0.4);
  }

  .answer-section {
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
    display: none;
  }

  .answer-section.visible { display: block; }
  .answer-label { font-size: 12px; color: #aac; letter-spacing: 1px; margin-bottom: 6px; }
  .answer-text { font-size: 17px; color: #00e5ff; font-weight: bold; }
  .answer-img {
    max-width: 100%;
    max-height: 260px;
    border-radius: 8px;
    margin-top: 12px;
    border: 2px solid rgba(0,229,255,0.4);
  }

  .bonus-banner {
    background: #ffd700;
    color: #1a1a1a;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 14px;
    display: inline-block;
  }

  .part-banner {
    background: #8a4aff;
    color: white;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 14px;
    display: inline-block;
  }

  .team-pick-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .team-pick-btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: 2px solid;
    font-weight: bold;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 14px;
  }
  .team-pick-btn.t1 { border-color: #ff6b6b; }
  .team-pick-btn.t2 { border-color: #4ecdc4; }
  .team-pick-btn:hover { background: rgba(255,255,255,0.18); }

  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .btn {
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.1s, opacity 0.2s;
  }

  .btn:hover { transform: scale(1.05); }
  .btn:active { transform: scale(0.97); }

  .btn-show { background: #ffd700; color: #1a1a1a; }
  .btn-correct1 { background: #ff6b6b; color: #1a1a1a; }
  .btn-correct2 { background: #4ecdc4; color: #1a1a1a; }
  .btn-wrong { background: #cc2200; color: white; }
  .btn-close { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
  .btn-edit { background: #ffae00; color: #1a1a1a; }
  .btn-danger { background: #cc2200; color: white; }
  .btn-bonus { background: #8a4aff; color: white; }

  .result-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 200;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .result-overlay.active { display: flex; }

  .result-text {
    font-size: 56px;
    font-weight: bold;
    font-family: 'Arial Black', Arial, sans-serif;
    animation: popIn 0.4s ease;
    text-align: center;
  }

  .result-correct1 { color: #ff6b6b; text-shadow: 0 0 30px #ff6b6b; }
  .result-correct2 { color: #4ecdc4; text-shadow: 0 0 30px #4ecdc4; }
  .result-wrong { color: #ff3300; text-shadow: 0 0 30px #ff3300; }

  @keyframes popIn {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    z-index: 300;
    pointer-events: none;
    animation: fall linear forwards;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .final-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }

  .final-screen.active { display: block; }

  .reset-btn {
    margin-top: 24px;
    padding: 14px 32px;
    background: #ffd700;
    color: #1a1a1a;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
  }

  /* Editor modal */
  .editor-card {
    background: #10204f;
    border: 3px solid #ffae00;
    border-radius: 16px;
    padding: 28px;
    max-width: 720px;
    width: 100%;
    margin: auto;
  }
  .editor-title { font-size: 20px; font-weight: bold; color: #ffae00; margin-bottom: 16px; text-align: center; }
  .field-group { margin-bottom: 14px; text-align: left; }
  .field-label { font-size: 12px; color: #aac; letter-spacing: 1px; margin-bottom: 4px; display: block; }
  .field-input, .field-select {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #3a5aaf;
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 14px;
  }
  .field-textarea {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #3a5aaf;
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 14px;
    min-height: 70px;
    resize: vertical;
    font-family: inherit;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row > div { flex: 1; }
  .img-preview {
    max-width: 100%;
    max-height: 160px;
    border-radius: 8px;
    margin-top: 8px;
    display: none;
  }
  .img-preview.visible { display: block; }
  .file-btn-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }

  .section-block {
    margin-top: 16px;
    border-top: 1px solid #3a5aaf;
    padding-top: 14px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #ddd;
  }
  .checkbox-label input { width: auto; }

  .list-editor {
    margin-top: 16px;
    border-top: 1px solid #3a5aaf;
    padding-top: 14px;
  }
  .list-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .list-row .cell-cat { width: 110px; color: #aac; flex-shrink: 0; }
  .list-row .cell-val { width: 50px; color: #ffd700; font-weight: bold; flex-shrink: 0; }
  .list-row .cell-q { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-row .cell-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .mini-btn {
    border: none;
    border-radius: 4px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
  }
  .mini-edit { background: #ffae00; color: #1a1a1a; }
  .mini-del { background: #cc2200; color: white; }
  .mini-bonus { background: #8a4aff; color: white; }

  .loading-note { text-align: center; color: #aac; font-size: 13px; padding: 10px; }
</style>

<div class="jeopardy-wrapper">
  <div class="game-title">⚕ ANATOMY JEOPARDY ⚕</div>

  <div class="top-bar">
    <button class="icon-btn" onclick="openEditorList()">✎ تعديل الأسئلة</button>
    <button class="icon-btn" onclick="openNewTeamSetup()">↺ بدء جديد</button>
  </div>

  <div class="scores-bar">
    <div class="score-box team1" id="score-box-1">
      <div class="turn-indicator">دور الفريق</div>
      <input class="team-name-input" id="team1-name" value="الفريق الأول" onchange="saveTeamNames()" />
      <div class="score-value" id="score1">$0</div>
      <div class="score-label">صحيح: <span id="correct1">0</span></div>
    </div>
    <div class="score-box team2" id="score-box-2">
      <div class="turn-indicator">دور الفريق</div>
      <input class="team-name-input" id="team2-name" value="الفريق الثاني" onchange="saveTeamNames()" />
      <div class="score-value" id="score2">$0</div>
      <div class="score-label">صحيح: <span id="correct2">0</span></div>
    </div>
  </div>

  <div class="meta-bar">
    <div>الأسئلة المتبقية: <b id="remaining">30</b></div>
  </div>

  <div class="board" id="board"></div>

  <div class="final-screen" id="final-screen">
    <div style="font-size:48px;margin-bottom:12px;">🏆</div>
    <div style="font-size:26px;font-weight:bold;color:#ffd700;margin-bottom:8px;" id="final-winner-text">انتهت اللعبة!</div>
    <div style="font-size:16px;color:#aac;margin-bottom:16px;" id="final-stats"></div>
    <button class="reset-btn" onclick="openNewTeamSetup()">▶ لعبة جديدة</button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="question-card" id="question-card-inner">
    <div id="bonus-banner-slot"></div>
    <div class="q-category" id="q-cat"></div>
    <div class="q-value" id="q-val"></div>
    <img class="q-img" id="q-img" src="" alt="question image" style="display:none;" />
    <div class="q-text" id="q-text"></div>
    <div class="answer-section" id="answer-section">
      <div class="answer-label">الإجابة:</div>
      <div class="answer-text" id="answer-text"></div>
      <img class="answer-img" id="answer-img" src="" alt="answer image" />
    </div>
    <div id="team-pick-slot"></div>
    <div class="btn-row" id="btn-row">
      <button class="btn btn-show" onclick="showAnswer()">🔍 إظهار الإجابة</button>
      <button class="btn btn-close" onclick="closeModal()">✕ إغلاق</button>
    </div>
  </div>
</div>

<div class="result-overlay" id="result-overlay">
  <div class="result-text" id="result-text"></div>
</div>

<!-- Editor: list of all questions -->
<div class="modal-overlay" id="editor-list-modal">
  <div class="editor-card" style="max-width:820px;">
    <div class="editor-title">إدارة الأسئلة</div>
    <div id="loading-note-list" class="loading-note" style="display:none;">جاري التحميل...</div>
    <div class="btn-row" style="margin-bottom:10px;">
      <button class="btn btn-edit" onclick="openQuestionEditor(null)">+ سؤال جديد</button>
      <button class="btn btn-bonus" onclick="exportGameData()">⭳ تصدير نسخة (JSON)</button>
      <button class="btn btn-bonus" onclick="document.getElementById('import-file-input').click()">⭱ استيراد نسخة</button>
      <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" onchange="importGameData(event)" />
      <button class="btn btn-close" onclick="closeEditorList()">✕ إغلاق</button>
    </div>
    <div id="import-export-note" style="font-size:12px; color:#aac; text-align:center; margin-bottom:10px;">
      التصدير بيحفظ كل الأسئلة (بما فيها أسئلة البونص والصور) في ملف واحد تقدر تنقله لأي جهاز وتستورده هناك.
    </div>
    <div class="list-editor" id="question-list-body" style="max-height:60vh; overflow-y:auto;"></div>
  </div>
</div>

<!-- Editor: single question add/edit -->
<div class="modal-overlay" id="editor-question-modal">
  <div class="editor-card">
    <div class="editor-title" id="qedit-title">تعديل السؤال</div>

    <div class="field-row">
      <div class="field-group">
        <label class="field-label">الفئة</label>
        <select class="field-select" id="edit-cat"></select>
      </div>
      <div class="field-group">
        <label class="field-label">القيمة ($)</label>
        <select class="field-select" id="edit-val">
          <option value="200">200</option>
          <option value="400">400</option>
          <option value="600">600</option>
          <option value="800">800</option>
          <option value="1000">1000</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">نص السؤال</label>
      <textarea class="field-textarea" id="edit-q"></textarea>
    </div>

    <div class="field-group">
      <label class="field-label">نص الإجابة</label>
      <textarea class="field-textarea" id="edit-a"></textarea>
    </div>

    <div class="field-group">
      <label class="field-label">صورة السؤال (اختياري — تظهر مع نص السؤال قبل الإجابة)</label>
      <div class="file-btn-row">
        <input type="file" id="edit-qimg-file" accept="image/*" onchange="handleQuestionImageUpload(event)" style="color:white; font-size:12px;" />
        <button class="mini-btn mini-del" id="remove-qimg-btn" style="display:none;" onclick="removeQuestionImage()">حذف الصورة</button>
      </div>
      <img class="img-preview" id="edit-qimg-preview" />
    </div>

    <div class="field-group">
      <label class="field-label">صورة الإجابة (اختياري — تظهر بعد الضغط على إظهار الإجابة)</label>
      <div class="file-btn-row">
        <input type="file" id="edit-img-file" accept="image/*" onchange="handleImageUpload(event)" style="color:white; font-size:12px;" />
        <button class="mini-btn mini-del" id="remove-img-btn" style="display:none;" onclick="removeImage()">حذف الصورة</button>
      </div>
      <img class="img-preview" id="edit-img-preview" />
    </div>

    <!-- Dual-image split question -->
    <div class="section-block">
      <label class="checkbox-label">
        <input type="checkbox" id="edit-has-second-image" onchange="toggleSecondImageFields()" />
        السؤال له صورة ثانية (هيتقسم لسؤالين متتاليين، كل واحد بصورته وقيمته)
      </label>
    </div>

    <div id="second-image-fields-block" style="display:none;">
      <div class="field-group" style="background:rgba(138,74,255,0.08); border-radius:8px; padding:10px; border:1px solid rgba(138,74,255,0.3);">
        <label class="field-label" style="color:#c9b3ff;">الجزء الأول (الحالي) — القيمة الخاصة بيه</label>
        <input class="field-input" type="number" id="edit-part1-val" min="0" step="10" placeholder="مثال: 200" />
      </div>

      <div class="field-group" style="margin-top:10px;">
        <label class="field-label">نص الجزء الثاني (سؤال إضافي يظهر بعد الإجابة على الأول)</label>
        <textarea class="field-textarea" id="edit-part2-q"></textarea>
      </div>
      <div class="field-group">
        <label class="field-label">إجابة الجزء الثاني</label>
        <textarea class="field-textarea" id="edit-part2-a"></textarea>
      </div>
      <div class="field-group">
        <label class="field-label">قيمة الجزء الثاني ($)</label>
        <input class="field-input" type="number" id="edit-part2-val" min="0" step="10" placeholder="مثال: 200" />
      </div>
      <div class="field-group">
        <label class="field-label">صورة سؤال الجزء الثاني (اختياري — تظهر مع نص السؤال قبل الإجابة)</label>
        <div class="file-btn-row">
          <input type="file" id="edit-part2-qimg-file" accept="image/*" onchange="handlePart2QuestionImageUpload(event)" style="color:white; font-size:12px;" />
          <button class="mini-btn mini-del" id="remove-part2-qimg-btn" style="display:none;" onclick="removePart2QuestionImage()">حذف الصورة</button>
        </div>

let categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
let questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
let teamNames = ["الفريق الأول", "الفريق الثاني"];
let scores = [0, 0];
let correctCounts = [0, 0];
let answered = 0;
let totalQuestionCount = 30;
let currentQ = null; // { id, stage: 'main' | 'part2' | 'bonus' }
let usedTiles = new Set(); // now keyed by question id, not cat-val
let activeTurn = 1;
let editingQuestionId = null;
let pendingImageData = null;
let pendingQuestionImageData = null;
let pendingBonusImageData = null;
let pendingBonusQuestionImageData = null;
let pendingPart2ImageData = null;
let pendingPart2QuestionImageData = null;

const STORAGE_KEY_GAME = "anatomy-jeopardy-game-data";
const STORAGE_KEY_STATE = "anatomy-jeopardy-game-state";

async function loadGameData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_GAME);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.categories && parsed.questions) {
        categories = parsed.categories;
        questions = parsed.questions.map(normalizeQuestion);
      }
    }
  } catch (e) {
    console.log("No saved game data yet, using defaults.", e);
  }
}

// Ensures older saved data (pre-update) gets sane defaults for new fields.
function normalizeQuestion(q) {
  const out = Object.assign({}, q);
  if (out.qimg === undefined) out.qimg = null;
  if (out.bonus) {
    out.bonus = Object.assign({ val: out.val, qimg: null }, out.bonus);
    if (out.bonus.val == null || out.bonus.val === '') out.bonus.val = out.val;
    if (out.bonus.qimg === undefined) out.bonus.qimg = null;
  }
  if (out.part2 === undefined) out.part2 = null;
  if (out.part2) {
    out.part2 = Object.assign({ val: out.val, qimg: null }, out.part2);
    if (out.part2.val == null || out.part2.val === '') out.part2.val = out.val;
    if (out.part2.qimg === undefined) out.part2.qimg = null;
  }
  return out;
}

async function saveGameData() {
  try {
    localStorage.setItem(STORAGE_KEY_GAME, JSON.stringify({ categories, questions }));
  } catch (e) {
    console.error("Failed to save game data:", e);
    alert('تعذر حفظ التعديلات. قد تكون مساحة التخزين ممتلئة (مثلاً بسبب صور كبيرة جداً).');
  }
}

async function loadGameState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_STATE);
    if (raw) {
      const parsed = JSON.parse(raw);
      teamNames = parsed.teamNames || teamNames;
      scores = parsed.scores || scores;
      correctCounts = parsed.correctCounts || correctCounts;
      answered = parsed.answered || 0;
      usedTiles = new Set(parsed.usedTiles || []);
      activeTurn = parsed.activeTurn || 1;
    }
  } catch (e) {
    console.log("No saved game state yet, starting fresh.", e);
  }
}

async function saveGameState() {
  try {
    localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify({
      teamNames, scores, correctCounts, answered,
      usedTiles: Array.from(usedTiles), activeTurn
    }));
  } catch (e) {
    console.error("Failed to save game state:", e);
  }
}

/* ===================== BOARD (flexible rows per category) ===================== */

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${categories.length}, 1fr)`;

  // Group questions by category, sorted by value then by id (stable order for duplicates).
  const byCat = categories.map((cat, idx) =>
    questions
      .filter(q => q.cat === idx)
      .sort((a, b) => a.val - b.val || String(a.id).localeCompare(String(b.id)))
  );

  const maxRows = Math.max(1, ...byCat.map(list => list.length));

  // Header row: category names.
  categories.forEach(cat => {
    const header = document.createElement('div');
    header.className = 'cat-header';
    header.textContent = cat.name;
    board.appendChild(header);
  });

  totalQuestionCount = questions.length;

  // Question rows.
  for (let r = 0; r < maxRows; r++) {
    for (let c = 0; c < categories.length; c++) {
      const q = byCat[c][r];
      if (!q) {
        const empty = document.createElement('div');
        empty.className = 'tile empty-slot';
        board.appendChild(empty);
        continue;
      }
      const used = usedTiles.has(q.id);
      const tile = document.createElement('div');
      tile.className = 'tile' + (used ? ' used' : '') + (!used && q.bonus ? ' bonus-tile' : '');
      tile.id = 'tile-' + q.id;
      if (!used) {
        let badges = '';
        if (q.bonus) badges += '<span class="bonus-star">⭐</span>';
        if (q.part2) badges += '<span class="dual-img-star">🖼️</span>';
        tile.innerHTML = badges + '$' + q.val;
        tile.onclick = () => openQuestion(q.id, 'main');
      }
      board.appendChild(tile);
    }
  }

  document.getElementById('remaining').textContent = Math.max(0, totalQuestionCount - answered);
}

function updateTurnUI() {
  document.getElementById('score-box-1').classList.toggle('active-turn', activeTurn === 1);
  document.getElementById('score-box-2').classList.toggle('active-turn', activeTurn === 2);
}

function refreshScoresUI() {
  document.getElementById('team1-name').value = teamNames[0];
  document.getElementById('team2-name').value = teamNames[1];
  document.getElementById('score1').textContent = '$' + scores[0];
  document.getElementById('score2').textContent = '$' + scores[1];
  document.getElementById('correct1').textContent = correctCounts[0];
  document.getElementById('correct2').textContent = correctCounts[1];
  updateTurnUI();
}

function saveTeamNames() {
  teamNames[0] = document.getElementById('team1-name').value || 'الفريق الأول';
  teamNames[1] = document.getElementById('team2-name').value || 'الفريق الثاني';
  saveGameState();
}

/* ===================== QUESTION FLOW ===================== */
// stage: 'main' (uses q.val/q.img/q.q/q.a), 'part2' (uses q.part2), 'bonus' (uses q.bonus)

function getStageData(q, stage) {
  if (stage === 'part2') return q.part2;
  if (stage === 'bonus') return q.bonus;
  return { q: q.q, a: q.a, img: q.img, qimg: q.qimg, val: q.val };
}

function openQuestion(qid, stage) {
  const q = questions.find(q => q.id === qid);
  if (!q) return;
  currentQ = { id: qid, stage };

  const data = getStageData(q, stage);
  const catIdx = q.cat;

  document.getElementById('q-cat').textContent = categories[catIdx] ? categories[catIdx].name : '';
  document.getElementById('q-val').textContent = '$' + data.val;
  document.getElementById('q-text').textContent = data.q;
  document.getElementById('answer-section').classList.remove('visible');
  document.getElementById('answer-text').textContent = data.a;

  const qImgEl = document.getElementById('q-img');
  if (data.qimg) {
    qImgEl.src = data.qimg;
    qImgEl.style.display = 'block';
  } else {
    qImgEl.style.display = 'none';
    qImgEl.src = '';
  }

  const imgEl = document.getElementById('answer-img');
  if (data.img) {
    imgEl.src = data.img;
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
  }

  let banner = '';
  if (stage === 'bonus') banner = '<div class="bonus-banner">⭐ سؤال بونص ⭐</div>';
  else if (stage === 'part2') banner = '<div class="part-banner">🖼️ الجزء الثاني من السؤال 🖼️</div>';
  document.getElementById('bonus-banner-slot').innerHTML = banner;
  document.getElementById('team-pick-slot').innerHTML = '';

  document.getElementById('btn-row').innerHTML = `
    <button class="btn btn-show" onclick="showAnswer()">🔍 إظهار الإجابة</button>
    <button class="btn btn-close" onclick="closeModal()">✕ إغلاق</button>
  `;
  document.getElementById('modal').classList.add('active');
}

function showAnswer() {
  document.getElementById('answer-section').classList.add('visible');

  const team1 = teamNames[0], team2 = teamNames[1];
  document.getElementById('team-pick-slot').innerHTML = `
    <div class="team-pick-row">
      <button class="team-pick-btn t1" onclick="markResult(1)">✓ ${escapeHtml(team1)}</button>
      <button class="team-pick-btn t2" onclick="markResult(2)">✓ ${escapeHtml(team2)}</button>
      <button class="btn btn-wrong" onclick="markResult(0)">✗ لا أحد جاوب صح</button>
    </div>
  `;
  document.getElementById('btn-row').innerHTML = `
    <button class="btn btn-close" onclick="closeModal()">✕ إغلاق</button>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function markResult(winningTeam) {
  const { id, stage } = currentQ;
  const q = questions.find(q => q.id === id);
  const data = getStageData(q, stage);
  const isMainTile = stage === 'main';

  if (isMainTile) {
    usedTiles.add(q.id);
    answered++;
  }

  if (winningTeam === 1 || winningTeam === 2) {
    const idx = winningTeam - 1;
    scores[idx] += data.val;
    correctCounts[idx]++;
    activeTurn = winningTeam === 1 ? 2 : 1;
    showResult(winningTeam, data.val);
    launchConfetti();
  } else {
    showResult(0, data.val);
  }

  refreshScoresUI();

  if (isMainTile) {
    const tile = document.getElementById('tile-' + q.id);
    if (tile) { tile.className = 'tile used'; tile.innerHTML = ''; tile.onclick = null; }
  }

  closeModal();
  saveGameState();

  // Sequencing: main -> part2 (if any) -> bonus (if any) -> done.
  if (stage === 'main' && q.part2 && q.part2.q && q.part2.a) {
    setTimeout(() => openQuestion(q.id, 'part2'), 1300);
  } else if (stage === 'main' && q.bonus && q.bonus.q && q.bonus.a) {
    setTimeout(() => openQuestion(q.id, 'bonus'), 1300);
  } else if (stage === 'part2' && q.bonus && q.bonus.q && q.bonus.a) {
    setTimeout(() => openQuestion(q.id, 'bonus'), 1300);
  } else if (isMainTile && answered === totalQuestionCount) {
    setTimeout(showFinal, 1000);
  } else if (stage !== 'main' && answered === totalQuestionCount) {
    setTimeout(showFinal, 1000);
  }
}

function showResult(winningTeam, val) {
  const overlay = document.getElementById('result-overlay');
  const text = document.getElementById('result-text');
  if (winningTeam === 0) {
    text.textContent = '✗ بدون إجابة صحيحة';
    text.className = 'result-text result-wrong';
  } else {
    text.textContent = '✓ ' + teamNames[winningTeam - 1] + ' +$' + val;
    text.className = 'result-text ' + (winningTeam === 1 ? 'result-correct1' : 'result-correct2');
  }
  overlay.classList.add('active');
  setTimeout(() => overlay.classList.remove('active'), 1500);
}

function launchConfetti() {
  const colors = ['#ffd700', '#00e5ff', '#ff6b6b', '#4ecdc4', '#ff69b4', '#a78bfa'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.2+Math.random()*1.5}s;animation-delay:${Math.random()*0.4}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function showFinal() {
  document.querySelector('.board').style.display = 'none';
  document.querySelector('.meta-bar').style.display = 'none';
  const fs = document.getElementById('final-screen');
  fs.classList.add('active');

  let winnerText;
  if (scores[0] > scores[1]) winnerText = '🏆 ' + teamNames[0] + ' يفوز!';
  else if (scores[1] > scores[0]) winnerText = '🏆 ' + teamNames[1] + ' يفوز!';
  else winnerText = '🤝 تعادل!';

  document.getElementById('final-winner-text').textContent = winnerText;
  document.getElementById('final-stats').innerHTML =
    `${escapeHtml(teamNames[0])}: $${scores[0]} (${correctCounts[0]} صحيح)<br>${escapeHtml(teamNames[1])}: $${scores[1]} (${correctCounts[1]} صحيح)`;
  launchConfetti();
}

function closeSetup() {

function confirmNewGame() {
  teamNames[0] = document.getElementById('setup-team1').value || 'الفريق الأول';
  teamNames[1] = document.getElementById('setup-team2').value || 'الفريق الثاني';
  scores = [0, 0];

function exportGameData() {
  const payload = {
    type: 'anatomy-jeopardy-export',
    version: 2,
    exportedAt: new Date().toISOString(),
    categories,
    questions
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  a.href = url;
  a.download = `anatomy-jeopardy-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importGameData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(e) {
    let parsed;
    try {
      parsed = JSON.parse(e.target.result);
    } catch (err) {
      alert('الملف غير صالح، تأكد إنه ملف JSON تم تصديره من اللعبة.');
      event.target.value = '';
      return;
    }

    if (!parsed || !Array.isArray(parsed.categories) || !Array.isArray(parsed.questions)) {
      alert('الملف لا يحتوي على بيانات أسئلة صحيحة.');
      event.target.value = '';
      return;
    }

    const replace = confirm(
      `سيتم استيراد ${parsed.questions.length} سؤال و ${parsed.categories.length} فئة.\n` +
      `اضغط "موافق" للاستبدال الكامل للأسئلة الحالية بهذه النسخة،\n` +
      `أو "إلغاء" للتراجع وعدم تغيير أي شيء.`
    );
    if (!replace) {
      event.target.value = '';
      return;
    }

    categories = parsed.categories;
    questions = parsed.questions.map(normalizeQuestion);
    await saveGameData();
    renderQuestionList();
    buildBoard();
    event.target.value = '';
    alert('تم استيراد البيانات بنجاح ✅');
  };
  reader.onerror = function() {
    alert('تعذرت قراءة الملف.');
    event.target.value = '';
  };
  reader.readAsText(file);
}

function populateCatSelect() {
  const sel = document.getElementById('edit-cat');
  sel.innerHTML = '';
  categories.forEach((cat, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = cat.name;
    sel.appendChild(opt);
  });
}

function openEditorList() {
  renderQuestionList();
  document.getElementById('editor-list-modal').classList.add('active');
}

function closeEditorList() {
  document.getElementById('editor-list-modal').classList.remove('active');
}

function renderQuestionList() {
  const body = document.getElementById('question-list-body');
  body.innerHTML = '';
  const sorted = [...questions].sort((a, b) => a.cat - b.cat || a.val - b.val);
  sorted.forEach(q => {
    const row = document.createElement('div');
    row.className = 'list-row';
    const catName = categories[q.cat] ? categories[q.cat].name : '?';
    let badges = '';
    if (q.bonus) badges += ' ⭐';
    if (q.part2) badges += ' 🖼️';
    row.innerHTML = `
      <div class="cell-cat">${escapeHtml(catName)}</div>
      <div class="cell-val">$${q.val}</div>
      <div class="cell-q">${escapeHtml(q.q)}${badges}</div>
      <div class="cell-actions">
        <button class="mini-btn mini-edit" onclick="openQuestionEditor('${q.id}')">تعديل</button>
        <button class="mini-btn mini-del" onclick="deleteQuestion('${q.id}')">حذف</button>
      </div>
    `;
    body.appendChild(row);
  });
}

async function deleteQuestion(id) {
  questions = questions.filter(q => q.id !== id);
  await saveGameData();
  renderQuestionList();
  buildBoard();
}

function openQuestionEditor(id) {
  editingQuestionId = id;
  populateCatSelect();
  pendingImageData = null;
  pendingQuestionImageData = null;
  pendingBonusImageData = null;
  pendingBonusQuestionImageData = null;
  pendingPart2ImageData = null;
  pendingPart2QuestionImageData = null;

  document.getElementById('edit-img-file').value = '';
  document.getElementById('edit-qimg-file').value = '';
  document.getElementById('edit-bonus-img-file').value = '';
  document.getElementById('edit-bonus-qimg-file').value = '';
  document.getElementById('edit-part2-img-file').value = '';
  document.getElementById('edit-part2-qimg-file').value = '';

  if (id) {
    const q = questions.find(q => q.id === id);
    document.getElementById('qedit-title').textContent = 'تعديل السؤال';
    document.getElementById('edit-cat').value = q.cat;
    document.getElementById('edit-val').value = q.val;
    document.getElementById('edit-q').value = q.q;
    document.getElementById('edit-a').value = q.a;
    setImagePreview('edit-img-preview', 'remove-img-btn', q.img);
    pendingImageData = q.img || null;
    setImagePreview('edit-qimg-preview', 'remove-qimg-btn', q.qimg);
    pendingQuestionImageData = q.qimg || null;

    // Bonus
    document.getElementById('edit-is-bonus').checked = !!q.bonus;
    if (q.bonus) {
      document.getElementById('edit-bonus-q').value = q.bonus.q || '';
      document.getElementById('edit-bonus-a').value = q.bonus.a || '';
      document.getElementById('edit-bonus-val').value = (q.bonus.val != null) ? q.bonus.val : q.val;
      setImagePreview('edit-bonus-img-preview', 'remove-bonus-img-btn', q.bonus.img);
      pendingBonusImageData = q.bonus.img || null;
      setImagePreview('edit-bonus-qimg-preview', 'remove-bonus-qimg-btn', q.bonus.qimg);
      pendingBonusQuestionImageData = q.bonus.qimg || null;
    } else {
      document.getElementById('edit-bonus-q').value = '';
      document.getElementById('edit-bonus-a').value = '';
      document.getElementById('edit-bonus-val').value = '';
      setImagePreview('edit-bonus-img-preview', 'remove-bonus-img-btn', null);
      setImagePreview('edit-bonus-qimg-preview', 'remove-bonus-qimg-btn', null);
    }

    // Dual image / part2
    document.getElementById('edit-has-second-image').checked = !!q.part2;
    document.getElementById('edit-part1-val').value = q.val;
    if (q.part2) {
      document.getElementById('edit-part2-q').value = q.part2.q || '';
      document.getElementById('edit-part2-a').value = q.part2.a || '';
      document.getElementById('edit-part2-val').value = (q.part2.val != null) ? q.part2.val : q.val;
      setImagePreview('edit-part2-img-preview', 'remove-part2-img-btn', q.part2.img);
      pendingPart2ImageData = q.part2.img || null;
      setImagePreview('edit-part2-qimg-preview', 'remove-part2-qimg-btn', q.part2.qimg);
      pendingPart2QuestionImageData = q.part2.qimg || null;
    } else {
      document.getElementById('edit-part2-q').value = '';
      document.getElementById('edit-part2-a').value = '';
      document.getElementById('edit-part2-val').value = '';
      setImagePreview('edit-part2-img-preview', 'remove-part2-img-btn', null);
      setImagePreview('edit-part2-qimg-preview', 'remove-part2-qimg-btn', null);
    }
  } else {
    document.getElementById('qedit-title').textContent = 'سؤال جديد';
    document.getElementById('edit-cat').value = 0;
    document.getElementById('edit-val').value = 200;
    document.getElementById('edit-q').value = '';
    document.getElementById('edit-a').value = '';
    document.getElementById('edit-is-bonus').checked = false;
    document.getElementById('edit-bonus-q').value = '';
    document.getElementById('edit-bonus-a').value = '';
    document.getElementById('edit-bonus-val').value = '';
    document.getElementById('edit-has-second-image').checked = false;
    document.getElementById('edit-part1-val').value = '';
    document.getElementById('edit-part2-q').value = '';
    document.getElementById('edit-part2-a').value = '';
    document.getElementById('edit-part2-val').value = '';
    setImagePreview('edit-img-preview', 'remove-img-btn', null);
    setImagePreview('edit-qimg-preview', 'remove-qimg-btn', null);
    setImagePreview('edit-bonus-img-preview', 'remove-bonus-img-btn', null);
    setImagePreview('edit-bonus-qimg-preview', 'remove-bonus-qimg-btn', null);
    setImagePreview('edit-part2-img-preview', 'remove-part2-img-btn', null);
    setImagePreview('edit-part2-qimg-preview', 'remove-part2-qimg-btn', null);
  }

  toggleBonusFields();
  toggleSecondImageFields();
  document.getElementById('editor-question-modal').classList.add('active');
}

function toggleBonusFields() {
  const isBonus = document.getElementById('edit-is-bonus').checked;

function toggleSecondImageFields() {
  const hasSecond = document.getElementById('edit-has-second-image').checked;
  document.getElementById('second-image-fields-block').style.display = hasSecond ? 'block' : 'none';
  if (hasSecond && !document.getElementById('edit-part1-val').value) {
    document.getElementById('edit-part1-val').value = document.getElementById('edit-val').value;
  }
}

function setImagePreview(imgId, btnId, dataUrl) {
  const img = document.getElementById(imgId);
  const btn = document.getElementById(btnId);
  if (dataUrl) {
    img.src = dataUrl;
    img.classList.add('visible');
    btn.style.display = 'inline-block';
  } else {
    img.src = '';
    img.classList.remove('visible');
    btn.style.display = 'none';
  }
}

async function saveQuestionEdit() {
  const cat = parseInt(document.getElementById('edit-cat').value, 10);
  const val = parseInt(document.getElementById('edit-val').value, 10);
  const qText = document.getElementById('edit-q').value.trim();
  const aText = document.getElementById('edit-a').value.trim();
  const isBonus = document.getElementById('edit-is-bonus').checked;
  const hasSecondImage = document.getElementById('edit-has-second-image').checked;

  if (!qText || !aText) {
    alert('من فضلك اكتب نص السؤال والإجابة.');
    return;
  }

  // Note: duplicate cat+val combinations are allowed by design (multiple
  // questions can share the same category and dollar value).

  let bonusData = null;
  if (isBonus) {
    const bq = document.getElementById('edit-bonus-q').value.trim();
    const ba = document.getElementById('edit-bonus-a').value.trim();
    const bvalRaw = document.getElementById('edit-bonus-val').value;
    if (!bq || !ba) {
      alert('من فضلك اكتب نص سؤال البونص وإجابته.');
      return;
    }
    if (bvalRaw === '' || isNaN(parseInt(bvalRaw, 10))) {
      alert('من فضلك حدد قيمة سؤال البونص.');
      return;
    }
    bonusData = { q: bq, a: ba, img: pendingBonusImageData || null, qimg: pendingBonusQuestionImageData || null, val: parseInt(bvalRaw, 10) };
  }

  let part2Data = null;
  let mainVal = val;
  if (hasSecondImage) {
    const p1valRaw = document.getElementById('edit-part1-val').value;
    const p2q = document.getElementById('edit-part2-q').value.trim();
    const p2a = document.getElementById('edit-part2-a').value.trim();
    const p2valRaw = document.getElementById('edit-part2-val').value;

    if (!p2q || !p2a) {
      alert('من فضلك اكتب نص وإجابة الجزء الثاني من السؤال.');
      return;
    }
    if (p1valRaw === '' || isNaN(parseInt(p1valRaw, 10))) {
      alert('من فضلك حدد قيمة الجزء الأول من السؤال.');
      return;
    }
    if (p2valRaw === '' || isNaN(parseInt(p2valRaw, 10))) {
      alert('من فضلك حدد قيمة الجزء الثاني من السؤال.');
      return;
    }
    mainVal = parseInt(p1valRaw, 10);
    part2Data = { q: p2q, a: p2a, img: pendingPart2ImageData || null, qimg: pendingPart2QuestionImageData || null, val: parseInt(p2valRaw, 10) };
  }

  if (editingQuestionId) {
    const q = questions.find(q => q.id === editingQuestionId);
    q.cat = cat;
    q.val = mainVal;
    q.q = qText;
    q.a = aText;
    q.img = pendingImageData || null;
    q.qimg = pendingQuestionImageData || null;
    q.bonus = bonusData;
    q.part2 = part2Data;
  } else {
    questions.push({
      id: 'q' + Date.now(),
      cat, val: mainVal, q: qText, a: aText,
      img: pendingImageData || null,
      qimg: pendingQuestionImageData || null,
      bonus: bonusData,
      part2: part2Data
    });
  }

  await saveGameData();
  closeQuestionEditor();
  renderQuestionList();
  buildBoard();
}

/* ===================== INIT ===================== */

function checkStorageAvailable() {
  try {
    const testKey = '__storage_test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return true;
  } catch (e) {
    return false;
  }
}

async function init() {
  if (!checkStorageAvailable()) {
    alert('تحذير: متصفحك لا يسمح بحفظ البيانات محلياً (قد يكون بسبب التصفح الخفي/Incognito). أي إضافة أو تعديل أو سؤال بونص لن يُحفظ بعد إعادة تحميل الصفحة.');
  }

  document.getElementById('loading-note-list').style.display = 'block';
  await loadGameData();
  await loadGameState();
  document.getElementById('loading-note-list').style.display = 'none';

  totalQuestionCount = questions.length;

  if (answered >= totalQuestionCount) {
    refreshScoresUI();
    buildBoard();
    showFinal();
  } else {
    refreshScoresUI();
    buildBoard();
  }
}

init();
